[project]
name = "athletics"
version = "0.1.0"
description = "This project utilizes RAG technology to provide information from the Athletics Rulebook as an MCP server."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "pdfplumber>=0.11.7",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.3.0",
    "flake8-cognitive-complexity>=0.1.0",
    "isort>=6.0.1",
]
